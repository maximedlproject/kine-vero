<!DOCTYPE html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden - Véronique Foulon Kinesitherapie</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f9f4ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;family=Work+Sans:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --grond: oklch(97% 0.012 70);
    --tekst: oklch(24% 0.015 50);
    --accent: #a15c3f;
    --accent-donker: #6b3a28;
    --lijn: oklch(88% 0.02 60);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 6vw;
    background: var(--grond);
    color: var(--tekst);
    font-family: 'Work Sans', system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 520px; text-align: center; }
  .merk {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--accent-donker);
    letter-spacing: 0.2px;
    margin: 0 0 40px;
  }
  .code {
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }
  h1 {
    font-family: 'Newsreader', Georgia, serif;
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 500;
    line-height: 1.2;
    margin: 0 0 18px;
  }
  p.uitleg { margin: 0 0 34px; color: oklch(40% 0.015 50); }
  .knoppen {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  a.knop {
    display: inline-block;
    padding: 13px 24px;
    border-radius: 3px;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
  }
  a.vol { background: var(--accent); color: oklch(98% 0.01 70); }
  a.rand { border: 2px solid var(--accent); color: var(--accent-donker); }
  a.knop:hover { opacity: 0.85; }
  footer {
    margin-top: 44px;
    padding-top: 22px;
    border-top: 1px solid var(--lijn);
    font-size: 14px;
    color: oklch(45% 0.015 50);
  }
  footer a { color: var(--accent-donker); }
</style>
</head>
<body>
<main>
  <p class="merk">Véronique Foulon</p>
  <p class="code">Fout 404</p>
  <h1>Deze pagina bestaat niet</h1>
  <p class="uitleg">Mogelijk is de link verouderd, of staat er een typfout in het adres.</p>
  <div class="knoppen">
    <a class="vol" href="/">Terug naar de homepage</a>
    <a class="rand" href="tel:+32478516265">Bel 0478 51 62 65</a>
  </div>
  <footer>
    Kanunnik Maesstraat 1, 8500 Kortrijk<br>
    <a href="/#contact">Contactgegevens</a>
  </footer>
</main>
</body>
</html>
